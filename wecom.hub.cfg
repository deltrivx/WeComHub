# WeComHub configuration
# Managed by the plugin UI. Do not edit by hand.
#
# Notification side (relay host / port / token / minimum importance) is configured at
#   Settings -> Notification -> Notification Agents -> WeComHub
# and lives in the agent script's variable block, not here.
#
# This file only holds the command side.

# Enable inbound commands (yes/no)
ENABLE_CMD=yes

# Local command service listening port
LOCAL_CMD_PORT=8181

# Containers allowed to be restarted by command.
#   empty = restart disabled
#   *     = any container
#   text  = only containers whose name starts with this prefix
RESTART_ALLOW_PREFIX=
