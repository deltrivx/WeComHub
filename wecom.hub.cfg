# WeComHub configuration
# 由 设置 → 通知 页面生成，勿手工编辑
# 所有值均为占位示例，请替换为你自己的配置

# 是否启用通知推送（yes/no）
ENABLE_NOTIFY=yes
# 是否启用指令交互（yes/no）
ENABLE_CMD=yes
# 中转服务地址（公网可达）
RELAY_HOST=RELAY_HOST
# 中转服务端口
RELAY_PORT=8181
# 与中转服务共享的推送令牌（请替换为真实值）
RELAY_PUSH_TOKEN=RELAY_PUSH_TOKEN
# 本地指令服务监听端口
LOCAL_CMD_PORT=8181
# 最低通知级别：normal | warning | alert
MIN_IMPORTANCE=normal
# 允许重启的容器名范围：空=禁用；* = 允许任意容器；其他值=前缀匹配
RESTART_ALLOW_PREFIX=
